@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1626; --surface: #12253d; --ink: #eaf1ff; --muted: #9fb3d1; --line: #2b4a70;
    --accent: #8fc1ff; --accent-ink: #06182c;
    --good: #6fdca0; --good-bg: #17402b; --bad: #ff9c85; --bad-bg: #4a2219; --mark: #4fc3bd1f; --logo: #dce9ff; --bg0:#1c3558; --bg1:#0e1d33; --bg2:#050b16; --c1:#fff; --c2:#cfe3ff; --c3:#9cc4ff; --vig:rgba(3,7,16,.75); --sw:rgba(255,255,255,.14); --dim:.88;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1626; --surface: #12253d; --ink: #eaf1ff; --muted: #9fb3d1; --line: #2b4a70;
  --accent: #8fc1ff; --accent-ink: #06182c;
  --good: #6fdca0; --good-bg: #17402b; --bad: #ff9c85; --bad-bg: #4a2219; --mark: #4fc3bd1f; --logo: #dce9ff; --bg0:#1c3558; --bg1:#0e1d33; --bg2:#050b16; --c1:#fff; --c2:#cfe3ff; --c3:#9cc4ff; --vig:rgba(3,7,16,.75); --sw:rgba(255,255,255,.14); --dim:.88;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 18px; line-height: 1.45;
  padding-inline: 16px; padding-block: 20px 40px;
}
.mark { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 0; }
.imlogo { display: block; aspect-ratio: 1203 / 405; background: currentColor; -webkit-mask: var(--imaan) center / contain no-repeat; mask: var(--imaan) center / contain no-repeat; }
.mark .imlogo { width: min(94vw, 760px); color: var(--logo); opacity: .17; }
.brand, .wrap { position: relative; z-index: 1; }
.brand { max-width: 560px; margin: 0 auto 18px; display: flex; align-items: center; gap: 8px; }
.id { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; margin-right: auto; }
.id > .imlogo { width: 104px; color: var(--logo); }
.handle { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted); overflow-wrap: anywhere; }
.icon { display: inline-grid; place-items: center; width: 44px; height: 44px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0; }
.icon svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme { display: inline-flex; flex: none; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 16px 0 12px; font-size: 15px; font-weight: 600; }
.theme svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
/* Welcome screen: always night mode, whatever theme the student picked. */
.splash {
  --bg: #0b1626; --ink: #eaf1ff; --muted: #9fb3d1; --accent: #9cc4ff; --line: #2d4a6e;
  position: fixed; inset: 0; z-index: 10; background: radial-gradient(ellipse at 50% 42%, #1a3150, #091221 75%); color: var(--ink); color-scheme: dark;
  display: grid; place-content: center; justify-items: center; gap: 26px; text-align: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px));
  transition: opacity .35s ease;
}
.splash { --surface: #13263f; overflow-y: auto; }
.splash.out { opacity: 0; }
.splash > *:not(.mk) { position: relative; z-index: 1; }
.splash > .icon { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); right: 16px; z-index: 2; }
.splash h2 { font-family: var(--font-display); font-size: 28px; letter-spacing: .02em; margin: 0; text-wrap: balance; animation: rise .6s ease both; }
.splash .name-form { width: min(86vw, 380px); display: flex; flex-direction: column; gap: 14px; animation: rise .6s .1s ease both; }
.splash input[type="text"] { width: 100%; min-height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 20px; text-align: center; padding: 0 16px; }
.splash input[type="text"]::placeholder { color: var(--muted); }
.splash .go { background: var(--accent); color: #07182c; border: 0; border-radius: 14px; min-height: 56px; font-weight: 600; font-size: 18px; width: 100%; }
.splash .err { min-height: 22px; color: #ff9c85; font-size: 15px; margin: 0; }
.splash.naming .big { width: min(70vw, 300px); animation: none; }
.splash .big { width: min(78vw, 340px); color: #fff; animation: rise .8s .1s ease both; }
.splash h1 { font-size: clamp(38px, 11vw, 56px); letter-spacing: .14em; margin: 0; animation: rise 1s 1.8s ease both; }
.splash .line { width: min(60vw, 240px); height: 3px; background: var(--line); border-radius: 99px; overflow: hidden; animation: rise 1s 1.8s ease both; }
.splash .line i { display: block; height: 100%; width: 0; background: var(--accent); animation: fill 6.5s linear forwards; }
.splash .handle { animation: rise 1s 1.8s ease both; }
.splash .tap { min-height: 52px; display: grid; place-items: center; font-size: 18px; font-weight: 600; color: var(--accent); border: 2px solid var(--accent); background: transparent; border-radius: 999px; padding: 0 28px; opacity: 0; visibility: hidden; transition: opacity .5s ease; }
.splash.ready .tap { opacity: 1; visibility: visible; animation: pulse 1.8s ease-in-out infinite; }
.splash.ready .line { opacity: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fill { to { width: 100%; } }
@keyframes pulse { 50% { transform: scale(1.04); } }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.hero h1 { font-size: 34px; }
.hero p { margin: 0; color: var(--muted); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0; margin: 0; list-style: none; }
.unit {
  width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  min-height: 92px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; justify-content: space-between;
}
.unit:active { transform: scale(.99); }
.unit b { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.unit span { font-size: 14px; color: var(--muted); }
.unit .done { color: var(--good); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; min-height: 52px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.toggle label { flex: 1; min-width: 0; }

.primary {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px;
  min-height: 56px; padding: 0 24px; font-weight: 600; font-size: 18px; width: 100%;
}
.secondary {
  background: transparent; border: 2px solid var(--line); border-radius: 14px;
  min-height: 52px; padding: 0 20px; font-weight: 600; width: 100%;
}
.link { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--accent); font-weight: 600; font-size: 16px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.card .q { font-family: var(--font-display); font-size: 30px; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.opt {
  width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line);
  border-radius: 14px; min-height: 58px; padding: 12px 16px; font-weight: 600; overflow-wrap: anywhere;
}
.opt:active { transform: scale(.99); }
.opt.good { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt[disabled] { cursor: default; }
.opt.dim { opacity: .55; }
.feedback { min-height: 26px; font-weight: 600; overflow-wrap: anywhere; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

.score { font-family: var(--font-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 28px; color: var(--muted); }
.congrats { font-size: 28px; line-height: 1.2; }
.got { font-size: 20px; font-weight: 600; color: var(--ink) !important; }
.farewell { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.review { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.review li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.review b { display: block; color: var(--accent); overflow-wrap: anywhere; }
.review span { font-size: 16px; color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .splash * { animation: none !important; } }


button { touch-action: manipulation; }
.rounds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.round { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; min-height: 76px; }
.round:not(:disabled):active { transform: scale(.99); }
.round .rn { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 21px var(--font-display); }
.round .rt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.round .rt b { font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
.round .rt span { font-size: 14px; color: var(--muted); }
.round .rs { font-size: 14px; font-weight: 700; color: var(--accent); }
.round.done .rn { background: var(--good); color: #fff; }
.round.done .rs { color: var(--good); }
.round:disabled { opacity: .6; cursor: not-allowed; }
.round:disabled .rn { background: var(--line); color: var(--muted); font-size: 18px; }
.round:disabled .rs { color: var(--muted); }
.who { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.who .link { display: inline; min-height: 0; padding: 0; font-size: 15px; }
.toast { white-space: nowrap; position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 11px 20px; font-weight: 600; font-size: 16px; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.toast.on { opacity: 1; transform: translateX(-50%); }

const app = document.getElementById("app");
let unit = 0, deck = [], pool = [], i = 0, score = 0, missed = [], locked = false, mix = false;
let rounds = [], round = 0, mode = "all", roundScores = [], unitMissed = [];

function shuffle(a) {
  a = a.slice();
  for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
  return a;
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function parts(t) { return t.split(";").map(x => x.trim().toLowerCase()); }
function getBest() { try { return JSON.parse(localStorage.getItem("ns-preint-best:" + pn()) || "{}"); } catch (e) { return {}; } }
function saveBest(u, n) { try { const b = getBest(); if (!(b[u] >= n)) { b[u] = n; localStorage.setItem("ns-preint-best:" + pn(), JSON.stringify(b)); } } catch (e) {} }

    </section>

// Rounds of about 20 words. A tiny leftover (under 10) joins the last round.
function chunkRounds(idx) {
  const out = []; let k = 0;
  while (k < idx.length) { const left = idx.length - k, take = left - 20 < 10 ? left : 20; out.push(idx.slice(k, k + take)); k += take; }
  return out;
}
// Remember the player and where they stopped (saved per player name on this device)
const pn = () => (player || "").trim().toLowerCase();
const resKey = () => "ns-preint-resume:" + pn();

function restore() {

  if (s && UNITS[s.unit]) {
    if (s.v === "rounds") return openUnit(s.unit);
    if (s.v === "quiz" && Array.isArray(s.deck) && Number.isInteger(s.i) && s.i >= 0 && s.i < s.deck.length && s.deck.every(k => UNITS[s.unit][k])) {
      unit = s.unit; pool = UNITS[unit]; rounds = getProg(unit).rounds; mode = s.mode; round = s.round | 0;
      deck = s.deck; i = s.i; score = s.score | 0; missed = Array.isArray(s.missed) ? s.missed : [];

}
function toast(msg) {

  setTimeout(() => t.classList.add("on"), 50); setTimeout(() => { t.classList.remove("on"); setTimeout(() => t.remove(), 500); }, 3200);

// Progress is kept per unit: which words are in each round (random, fixed), best score per round, missed words.
const rkey = () => "ns-preint-rounds:" + pn(); let rmem = {};
function loadR() { try { return JSON.parse(localStorage.getItem(rkey()) || "{}"); } catch (e) { return rmem; } }
function saveR(o) { rmem = o; try { localStorage.setItem(rkey(), JSON.stringify(o)); } catch (e) {} }
function freshProg(u) { const r = chunkRounds(shuffle(UNITS[u].map((_, k) => k))); return { rounds: r, done: r.map(() => null), best: r.map(() => null), miss: r.map(() => []) }; }
function getProg(u) {

}
function setRound(u, r, sc, miss, passed) {
  const all = loadR(), p = getProg(u); all[u] = p;
  if (p.best[r] == null || sc > p.best[r]) p.best[r] = sc;
  if (passed && (p.done[r] == null || sc >= p.done[r])) { p.done[r] = sc; p.miss[r] = miss; }
  saveR(all);
}
const allDone = p => p.done.every(x => x != null);
function unitRounds(u) { const pr = loadR()[u]; return pr ? pr.rounds.length : chunkRounds(UNITS[u].map((_, k) => k)).length; }
function unitTag(u, best) {
  const pr = loadR()[u], n = UNITS[u].length, dn = pr ? pr.done.filter(x => x != null).length : 0;
  if (pr && dn === pr.rounds.length) return `<span class="done">Best ${Math.max(best[u] || 0, pr.done.reduce((a, b) => a + b, 0))}/${n}</span>`;
  if (dn) return `<span class="done">${dn}/${pr.rounds.length} rounds done</span>`;

// Screen shown when a unit is opened: one button per round; round 2 stays locked until round 1 is finished, and so on.
function openUnit(u) {
  unit = u; pool = UNITS[u];
  const p = getProg(u); rounds = p.rounds; saveResume({ v: "rounds", unit: u });

function beginRound(k) { mode = "round"; round = k; deck = shuffle(rounds[k]); i = 0; score = 0; missed = []; show(); }

function start(u, subset) { unit = u; pool = UNITS[u]; mode = "missed"; deck = shuffle(subset); i = 0; score = 0; missed = []; show(); }

function show() {
  locked = false;
  const idx = deck[i];
  const [word, correct] = pool[idx];
  const cp = parts(correct);
  const cands = shuffle(pool.map((_, k) => k).filter(k => k !== idx && !parts(pool[k][1]).some(p => cp.includes(p))));
  const chosen = [], seen = new Set(cp);
  for (const k of cands) { if (!seen.has(pool[k][1])) { chosen.push(k); seen.add(pool[k][1]); } if (chosen.length === 3) break; }
  const options = shuffle([idx, ...chosen]);
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Rounds</button><span class="chip">Score ${score}</span></div>
    <div class="top"><span class="eyebrow">Unit ${unit} · ${mode === "round" ? "Round " + (round + 1) + " of " + rounds.length + " · " : mode === "all" ? "All words · " : ""}Question ${i + 1} of ${deck.length}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${deck.length}" aria-valuenow="${i}"><i style="width:${(i / deck.length) * 100}%"></i></div>
    <div class="card"><div class="eyebrow">What does this mean?</div><p class="q">${esc(word)}</p></div>
    <ul class="opts">${options.map(k => `<li><button class="opt" data-k="${k}">${esc(pool[k][1])}</button></li>`).join("")}</ul>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <button class="primary" id="next" hidden>${i + 1 === deck.length ? "See results" : "Next"}</button>`;
  document.getElementById("back").onclick = () => openUnit(unit);
  app.querySelectorAll(".opt").forEach(btn => btn.onclick = () => answer(btn, idx));
  document.getElementById("next").onclick = () => { i++; i < deck.length ? show() : finish(); };
  saveResume({ v: "quiz", unit, mode, round, deck, i, score, missed });
  window.scrollTo(0, 0);
}

function answer(btn, idx) {
  if (locked) return; locked = true;
  const chosen = parseInt(btn.dataset.k, 10);
  try { ImaanBG.shake(); } catch (e) {}
  const fb = document.getElementById("fb");
  app.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const k = parseInt(b.dataset.k, 10);
    if (k === idx) b.classList.add("good");
    else if (b === btn) b.classList.add("bad");
    else b.classList.add("dim");
  });
  if (chosen === idx) { score++; play("correct"); fb.textContent = "Correct!"; fb.className = "feedback good"; }
  else { missed.push(idx); play("wrong"); fb.textContent = "Not quite. The answer is “" + pool[idx][1] + "”."; fb.className = "feedback bad"; }
  const next = document.getElementById("next");
  next.hidden = false; next.focus();
  next.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

const QUOTES = {

function pickQuote(pct) {

}
const HEAD = pct => pct >= 80 ? "Congratulations" : pct >= 50 ? "Well done" : "Keep going";
const passNeed = n => Math.min(15, Math.ceil(n * 0.75));   // 15 correct answers to pass (small rounds: 75%)

const bgm = new Audio(BGM_SRC);
bgm.loop = true; bgm.preload = "auto"; bgm.volume = 0.6;
let bgmWanted = false, bgmFade = null;
function bgmStart() {
  bgmWanted = true;
  if (!soundOn || document.hidden) return;
  clearInterval(bgmFade); bgm.volume = 0.6;
  const p = bgm.play(); if (p && p.catch) p.catch(() => {});
}
function bgmStop() {
  bgmWanted = false; clearInterval(bgmFade);
  bgmFade = setInterval(() => {
    if (bgm.volume > 0.06) bgm.volume = Math.max(0, bgm.volume - 0.06);
    else { clearInterval(bgmFade); bgm.pause(); bgm.currentTime = 0; bgm.volume = 0.6; }
  }, 50);
}

function isDark() {

  if (t) return t === "dark";
  return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
}
function paintThemeBtn() {
  themeBtn.innerHTML = isDark() ? SUN + "Light mode" : MOON + "Night mode";
  themeBtn.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to night mode");
}
themeBtn.onclick = () => {
  const next = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("ns-theme", next); } catch (e) {}
  paintThemeBtn();
};
try { const saved = localStorage.getItem("ns-theme"); if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved); } catch (e) {}
paintThemeBtn();

// Welcome screen: about 6.5 seconds, then a "Tap to start" prompt. The unit menu is already ready underneath.
let player = "";
try { player = localStorage.getItem("ns-name") || ""; } catch (e) {}
function buildSplash() {
  const el = document.createElement("div");
  el.className = "splash"; el.id = "splash";
  el.innerHTML = `<button class="icon" data-sound type="button"></button><span class="imlogo big" role="img" aria-label="Imaan English School"></span>`;
  document.body.appendChild(el);
  paintSoundBtn();
  el.querySelector(".icon").onclick = e => { e.stopPropagation(); toggleSound(); };
  return el;
}
// Logo intro: starts by itself when the file opens, then the name screen appears.
function runIntro(box, done) {
  const svg = box.querySelector("#isv"), NS = "http://www.w3.org/2000/svg";
  const R = (a, b) => a + Math.random() * (b - a), lite = matchMedia("(pointer:coarse)").matches;
  const add = (p, t, at) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); p.appendChild(e); return e; };
  const stars = svg.querySelector("#stars"), rays = svg.querySelector("#rays");
  for (let i = 0; i < (lite ? 28 : 70); i++) {
    const c = add(stars, "circle", { cx: R(0, 1920), cy: R(0, 1080), r: R(.8, 2.4) });
    c.style.setProperty("--d", R(3, 8).toFixed(1) + "s"); c.style.setProperty("--l", "-" + R(0, 6).toFixed(1) + "s");
  }
  const N = lite ? 24 : 36;
  for (let i = 0; i < N; i++) {
    const a = (i * 360 / N + R(-3, 3)) * Math.PI / 180, r1 = 138, r2 = r1 + (i % 2 ? 330 : 605) * R(.6, 1.2);
    add(rays, "line", { x1: 503.5 + r1 * Math.cos(a), y1: 443.5 + r1 * Math.sin(a), x2: 503.5 + r2 * Math.cos(a), y2: 443.5 + r2 * Math.sin(a), "stroke-width": R(2, 5).toFixed(1), "stroke-opacity": R(.2, .7).toFixed(2) });
  }
  // wordmark reveal is driven by JS (iOS Safari does not animate CSS inside <mask>)
  const wipe = svg.querySelector("#wipe"), edge = svg.querySelector("#edge"), t0 = performance.now();
  let raf = 0;
  (function f(now) {
    const p = Math.min(Math.max((now - t0) / 1000 - 2.7, 0) / 1.3, 1), e = p * p * (3 - 2 * p);
    wipe.setAttribute("width", 730 * e);
    edge.setAttribute("transform", "translate(" + (770 + 730 * e) + " 0)");
    edge.style.opacity = p > 0 && p < 1 ? Math.min(1, p * 12, (1 - p) * 8) : 0;
    if (p < 1) raf = requestAnimationFrame(f);
  })(t0);
  svg.classList.add("play");
  // sound: starts at once if the browser allows it, otherwise on the first tap (joining at the right moment)
  const hint = box.querySelector("#imhint");
  let started = false;
  const go = () => {
    if (started || !audioCtx || audioCtx.state !== "running") return;
    started = true; hint.classList.remove("on");
    try { SFX.intro((performance.now() - t0) / 1000); } catch (e) {}
  };
  const startSound = () => { if (started || !soundOn) return; try { const c = ac(); if (!c) return; c.state === "running" ? go() : c.resume().then(go).catch(() => {}); } catch (e) {} };
  startSound();
  ["pointerdown", "touchstart", "touchend", "mousedown", "click", "keydown"].forEach(ev => document.addEventListener(ev, startSound, { passive: true }));
  setTimeout(() => { hint.classList.remove("on"); ["pointerdown", "touchstart", "touchend", "mousedown", "click", "keydown"].forEach(ev => document.removeEventListener(ev, startSound)); done(); }, 8200);
}
function intro() {
  restore();
  const box = document.getElementById("intro");
  let shown = false;
  const done = () => {
    if (shown) return; shown = true;
    if (player) { document.body.classList.remove("cover"); toast("Welcome back, " + player + "!"); } else askName(buildSplash());
    box.classList.add("out"); setTimeout(() => box.remove(), 900);
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return done();
  // Browsers only allow sound after a touch. If sound is already allowed we start at once; otherwise the
  // "TAP TO START" screen waits, and the animation, logo sound and music all start together on that tap.
  let begun = false;
  const EV = ["pointerup", "touchend", "click", "keydown"];
  const begin = () => {
    if (begun) return; begun = true;
    EV.forEach(ev => document.removeEventListener(ev, begin, true));
    if (soundOn) { try { ac(); bgm.muted = true; const pr = bgm.play(); if (pr && pr.then) pr.then(() => { bgm.pause(); bgm.currentTime = 0; bgm.muted = false; }).catch(() => { bgm.muted = false; }); } catch (e) {} }
    box.classList.add("go");
    runIntro(box, done);
  };
  EV.forEach(ev => document.addEventListener(ev, begin, true));
  if (!soundOn) return begin();
  try { const c = ac(); setTimeout(() => { if (c && c.state === "running") begin(); }, 150); } catch (e) { begin(); }
}
function askName(el) {
  el.onclick = null; bgmStart();
  el.classList.remove("ready"); el.classList.add("naming");
  el.querySelectorAll("h1, .line, .tap, .handle").forEach(n => n.remove());
  const form = document.createElement("form");
  form.className = "name-form"; form.setAttribute("novalidate", "");
  form.innerHTML = `
    <h2>What is your name?</h2>
    <input type="text" id="player-name" maxlength="30" autocomplete="given-name" enterkeyhint="go" placeholder="Write your name" aria-label="Your name" value="${esc(player)}">
    <p class="err" id="name-err" aria-live="polite"></p>
    <button class="go" type="submit">Start</button>`;
  el.appendChild(form);
  const input = document.getElementById("player-name");
  form.onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim().replace(/\s+/g, " ").slice(0, 30);
    if (!v) { document.getElementById("name-err").textContent = "Please write your name to start."; input.focus(); return; }
    player = v;
    try { localStorage.setItem("ns-name", v); } catch (err) {}
    restore();
    play("start"); bgmStop(); document.body.classList.remove("cover");
    el.classList.add("out");
    setTimeout(() => { el.remove(); window.scrollTo(0, 0); }, 360);
  };
  setTimeout(() => { try { input.focus(); } catch (err) {} }, 50);
}
// Living background: stars, depth bokeh, light rays, sizing, and ImaanBG.shake()
(function () {
  const NS = "http://www.w3.org/2000/svg", R = (a, b) => a + Math.random() * (b - a);
  const add = (p, t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const bg = document.getElementById("bg"), root = document.documentElement;
  const st = bg.querySelector("#bgStars"), bk = bg.querySelector("#bgBok"), rays = bg.querySelector("#bgRays");
  for (let i = 0; i < 130; i++) {            // small far stars + larger near stars, spread wide so tall phones are filled
    const big = i >= 80, c = add(st, "circle", { cx: R(-600, 2520), cy: R(-1800, 2900), r: big ? R(1.6, 3) : R(.7, 1.5) });
    c.style.setProperty("--d", R(big ? 4 : 6, big ? 9 : 12).toFixed(1) + "s"); c.style.setProperty("--l", "-" + R(0, 10).toFixed(1) + "s");
    c.style.setProperty("--m", big ? "-52px" : "-26px");
  }
  for (let i = 0; i < 22; i++) {             // soft out-of-focus light orbs for depth
    const c = add(bk, "circle", { cx: R(-300, 2220), cy: R(-1200, 2300), r: R(70, 230) });
    c.style.setProperty("--d", R(16, 32).toFixed(1) + "s"); c.style.setProperty("--l", "-" + R(0, 20).toFixed(1) + "s"); c.style.setProperty("--o", R(.05, .16).toFixed(2));
  }
  for (let i = 0; i < 36; i++) {             // rays that burst from the star
    const a = (i * 10 + R(-3, 3)) * Math.PI / 180, r1 = 138, r2 = r1 + (i % 2 ? 330 : 605) * R(.6, 1.2);
    add(rays, "line", { x1: 503.5 + r1 * Math.cos(a), y1: 443.5 + r1 * Math.sin(a), x2: 503.5 + r2 * Math.cos(a), y2: 443.5 + r2 * Math.sin(a), "stroke-width": R(2, 5).toFixed(1), "stroke-opacity": R(.2, .7).toFixed(2) });
  }
  function fit() {                            // px size of one design unit + where the star is on screen (for the jolt)
    const W = innerWidth, H = innerHeight, u = Math.min(W / 1920, H / 1080);
    root.style.setProperty("--u", u + "px");
    bg.style.setProperty("--jx", ((W - 1920 * u) / 2 + 432.2 * u) + "px"); bg.style.setProperty("--jy", ((H - 1080 * u) / 2 + 542.7 * u) + "px");
  }
  fit(); addEventListener("resize", fit);
  const hit = bg.querySelector("#bghit");
  window.ImaanBG = {
    shake() { hit.classList.remove("go"); void hit.offsetWidth; hit.classList.add("go"); },
    dim(v) { v = parseFloat(v); if (isFinite(v)) bg.style.setProperty("--dim", Math.min(1, Math.max(0, v))); }
  };
})();
intro();
</script>
